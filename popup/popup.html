<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reading Flow Coach</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <img src="../assets/icons/icon-48.png" alt="Reading Flow Coach" class="popup-logo" />
      <div>
        <h1>Reading Flow Coach</h1>
        <p>읽기 보조 기능 제어</p>
      </div>
    </header>

    <section class="toggle-list">
      <label class="toggle-row">
        <span>
          <strong>플러그인 활성화</strong>
          <small>선택 분석, 메모, 사이드바 기능 전체를 켜거나 끕니다.</small>
        </span>
        <input id="extensionEnabled" type="checkbox" />
      </label>

      <label class="toggle-row">
        <span>
          <strong>하단 플로팅 아이콘</strong>
          <small>영역 분석용 하단 고정 버튼만 별도로 켜거나 끕니다.</small>
        </span>
        <input id="floatingButtonEnabled" type="checkbox" />
      </label>
    </section>

    <section class="action-list">
      <button id="enterInspectMode" type="button">영역 분석 시작</button>
      <button id="toggleSidebar" type="button">사이드바 열기/닫기</button>
      <button id="openOptions" type="button" class="secondary">상세 설정</button>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
