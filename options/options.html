<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reading Flow Coach 설정</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="options-shell">
    <header class="options-header">
      <img src="../assets/icons/icon-48.png" alt="Reading Flow Coach" class="options-logo" />
      <div>
        <h1>Reading Flow Coach 설정</h1>
        <p>기능 활성화와 표시 방식을 조정합니다.</p>
      </div>
    </header>

    <section class="options-card">
      <label class="option-row">
        <span>
          <strong>플러그인 활성화</strong>
          <small>웹페이지에서 선택 분석, 메모, 사이드바 기능 전체를 켜거나 끕니다.</small>
        </span>
        <input id="extensionEnabled" type="checkbox" />
      </label>

      <label class="option-row">
        <span>
          <strong>하단 플로팅 아이콘 표시</strong>
          <small>영역 분석용 고정 버튼만 별도로 켜거나 끕니다.</small>
        </span>
        <input id="floatingButtonEnabled" type="checkbox" />
      </label>

      <label class="option-row">
        <span>
          <strong>사이드바 자동 열기</strong>
          <small>분석 결과 표시 시 사이드바를 자동으로 엽니다.</small>
        </span>
        <input id="autoOpenSidebar" type="checkbox" />
      </label>

      <label class="option-row">
        <span>
          <strong>모션 줄이기</strong>
          <small>애니메이션과 시각 효과를 최소화합니다.</small>
        </span>
        <input id="reduceMotion" type="checkbox" />
      </label>
    </section>

    <div class="actions">
      <button id="saveBtn" type="button">저장</button>
      <span id="status" aria-live="polite"></span>
    </div>
  </main>
  <script src="options.js"></script>
</body>
</html>
